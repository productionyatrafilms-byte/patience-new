<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patience - Home</title>
    <link rel="stylesheet" href="./assets/plugins/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/common.css">
    <link rel="stylesheet" href="./assets/css/home.css">
</head>

<body id="body">

    <div id="langSelect">
        <div id="language">
            <label><input type="radio" onclick="val('English')" name="lang" id="en" value="English">
                <span>E</span>
            </label>
            <label><input type="radio" onclick="val('Hindi')" name="lang" id="hi" value="Hindi">
                <span>H</span>
            </label>
            <label><input type="radio" onclick="val('Gujrati')" name="lang" id="gu" value="Gujrati">
                <span>G</span>
            </label>
        </div>
    </div>

    <img class="page-bg" src="./assets/images/background.png" alt="">

    <div class="main-container">
        <div class="stage">
            <img class="stage-spacer" src="./assets/images/stage-spacer.png" alt="">

            <img class="home-bg" src="./assets/images/home-bg.png" alt="">

            <a class="back-btn" href="./index.html">
                <img class="back-btn-image" src="./assets/images/back.png" alt="Back">
            </a>

            <div class="pendulum-item pendulum-blonde">
                <div class="pendulum-face">
                    <img class="pendulum-face-sprite" src="./assets/images/face-blonde.png" alt="Blonde character hanging from a rope">
                </div>
                <a class="question-card" href="./define.html">
                    <p class="question-text" data-card="1"></p>
                </a>
            </div>

            <div class="pendulum-item pendulum-dog">
                <div class="pendulum-face">
                    <img class="pendulum-face-sprite" src="./assets/images/face-dog.png" alt="Dog character hanging from a rope">
                </div>
                <a class="question-card" href="./when.html">
                    <p class="question-text" data-card="2"></p>
                </a>
            </div>

            <div class="pendulum-item pendulum-moustache">
                <div class="pendulum-face">
                    <img class="pendulum-face-sprite" src="./assets/images/face-moustache.png" alt="Moustached character in a bowler hat hanging from a rope">
                </div>
                <a class="question-card" href="./rewards.html">
                    <p class="question-text" data-card="3"></p>
                </a>
            </div>

            <div class="pendulum-item pendulum-pig">
                <div class="pendulum-face">
                    <img class="pendulum-face-sprite" src="./assets/images/face-pig.png" alt="Pig character hanging from a rope">
                </div>
                <a class="question-card" href="./why.html">
                    <p class="question-text" data-card="4"></p>
                </a>
            </div>

            <div class="pendulum-item pendulum-cat">
                <div class="pendulum-face">
                    <img class="pendulum-face-sprite" src="./assets/images/face-cat.png" alt="Yellow cat character hanging from a rope">
                </div>
                <a class="question-card" href="./how.html">
                    <p class="question-text" data-card="5"></p>
                </a>
            </div>

            <img class="cradle-boy" src="./assets/images/1.png" alt="Cowboy character swinging on a rope">
            <img class="cradle-girl" src="./assets/images/7.png" alt="Girl character swinging on a rope">

            <h1 class="page-title home-title" data-text="patience"></h1>
        </div>
    </div>

    <script src="./assets/plugins/swiper/swiper-bundle.min.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/text.js"></script>
    <script src="./assets/js/home.js"></script>

</html>
