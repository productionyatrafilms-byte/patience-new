<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patience</title>
    <link rel="stylesheet" href="./assets/plugins/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/common.css">
    <link rel="stylesheet" href="./assets/css/topic.css">
</head>

<body id="body" data-topic="2">

    <div id="langSelect">
        <div id="language">
            <label><input type="radio" onclick="val('English')" name="lang" id="en" value="English">
                <span>E</span>
            </label>
            <label><input type="radio" onclick="val('Hindi')" name="lang" id="hi" value="Hindi">
                <span>H</span>
            </label>
            <label><input type="radio" onclick="val('Gujrati')" name="lang" id="gu" value="Gujrati">
                <span>G</span>
            </label>
        </div>
    </div>

    <img class="page-bg" src="./assets/images/background.png" alt="">

    <div class="main-container">
        <div class="stage">
            <img class="stage-spacer" src="./assets/images/stage-spacer.png" alt="">

            <img class="define-bg" src="./assets/images/define-bg.png" alt="">

            <a class="home-btn" href="./home.html">
                <img class="home-btn-image" src="./assets/images/home-icon.png" alt="Home">
            </a>

            <h1 class="define-title" id="topicTitle"></h1>

            <div class="photo-frame">
                <img class="photo-spacer" id="photoSpacer" width="863" height="622" src="./assets/images/stage-spacer.png" alt="">
                <div class="swiper photo-slider">
                    <div class="swiper-wrapper" id="photoSlides"></div>
                </div>
                <div class="photo-border"></div>
            </div>

            <div class="caption-box">
                <div class="caption-sizer" aria-hidden="true">&nbsp;<br>&nbsp;</div>
                <div class="swiper caption-slider">
                    <div class="swiper-wrapper" id="captionSlides"></div>
                </div>
            </div>

            <button class="nav-btn nav-up is-disabled" type="button" aria-label="Previous slide">
                <img class="nav-btn-image" src="./assets/images/nav-up.png" alt="">
            </button>
            <button class="nav-btn nav-down" type="button" aria-label="Next slide">
                <img class="nav-btn-image" src="./assets/images/nav-down.png" alt="">
            </button>

            <nav class="topic-rail" id="topicRail" aria-label="Topics"></nav>
        </div>
    </div>

    <script src="./assets/plugins/swiper/swiper-bundle.min.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/topic.js"></script>
</body>

</html>
